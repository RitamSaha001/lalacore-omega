<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>LalaCore AI Chat</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./static/styles.css" />
  </head>
  <body>
    <div class="app-shell" data-sidebar="open">
      <aside class="sidebar" aria-label="AI chat history">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M12 3l1.8 4.7 5 .3-3.85 3.25 1.2 4.9L12 13.5l-4.15 2.65 1.2-4.9L5.2 8l5-.3L12 3z" /></svg>
          </div>
          <div>
            <h1>LalaCore AI</h1>
            <p>Dedicated chat</p>
          </div>
        </div>

        <button class="primary-action" id="newChatButton" type="button">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M12 5v14M5 12h14" /></svg>
          <span>New Chat</span>
        </button>

        <div class="field-block compact">
          <label for="historySearch">Search chats</label>
          <input id="historySearch" type="search" autocomplete="off" placeholder="Topic or prompt" />
        </div>

        <nav class="history-list" id="historyList" aria-label="Saved conversations"></nav>
      </aside>

      <main class="chat-surface">
        <header class="topbar">
          <button class="icon-button sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle history">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <div class="chat-title">
            <h2 id="chatTitle">New AI Chat</h2>
            <p id="chatSubtitle">LalaCore engine ready</p>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="refreshHistoryButton" type="button" aria-label="Refresh history">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M20 6v5h-5M4 18v-5h5" /><path d="M18.1 9A7 7 0 0 0 6.4 5.8L4 8m2 7a7 7 0 0 0 11.6 3.2L20 16" /></svg>
            </button>
            <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" /><path d="M19.4 15a1.9 1.9 0 0 0 .38 2.1l.05.05a2.2 2.2 0 0 1-3.1 3.1l-.05-.05a1.9 1.9 0 0 0-2.1-.38 1.9 1.9 0 0 0-1.15 1.74v.14a2.2 2.2 0 0 1-4.4 0v-.14a1.9 1.9 0 0 0-1.15-1.74 1.9 1.9 0 0 0-2.1.38l-.05.05a2.2 2.2 0 0 1-3.1-3.1l.05-.05A1.9 1.9 0 0 0 3.1 15a1.9 1.9 0 0 0-1.74-1.15H1.2a2.2 2.2 0 0 1 0-4.4h.16A1.9 1.9 0 0 0 3.1 8.3a1.9 1.9 0 0 0-.38-2.1l-.05-.05a2.2 2.2 0 0 1 3.1-3.1l.05.05a1.9 1.9 0 0 0 2.1.38A1.9 1.9 0 0 0 9.08 1.7V1.6a2.2 2.2 0 0 1 4.4 0v.1a1.9 1.9 0 0 0 1.15 1.78 1.9 1.9 0 0 0 2.1-.38l.05-.05a2.2 2.2 0 0 1 3.1 3.1l-.05.05a1.9 1.9 0 0 0-.38 2.1 1.9 1.9 0 0 0 1.74 1.15h.12a2.2 2.2 0 0 1 0 4.4h-.12A1.9 1.9 0 0 0 19.4 15z" /></svg>
            </button>
          </div>
        </header>

        <section class="settings-panel" id="settingsPanel" hidden>
          <div class="settings-grid">
            <div class="field-block">
              <label for="backendUrl">Backend URL</label>
              <input id="backendUrl" type="url" spellcheck="false" />
            </div>
            <div class="field-block">
              <label for="accountId">Account</label>
              <input id="accountId" type="text" spellcheck="false" />
            </div>
            <div class="field-block">
              <label for="userId">User</label>
              <input id="userId" type="text" spellcheck="false" />
            </div>
            <div class="field-block">
              <label for="chatFunction">Mode</label>
              <select id="chatFunction">
                <option value="general_chat">General chat</option>
                <option value="ai_chat">AI chat</option>
                <option value="ai_solve">AI solve</option>
              </select>
            </div>
          </div>
          <div class="settings-actions">
            <label class="toggle-row">
              <input id="bestModelToggle" type="checkbox" />
              <span>Prefer strongest model retry profile</span>
            </label>
            <button class="secondary-action" id="saveSettingsButton" type="button">Save Settings</button>
          </div>
        </section>

        <section class="messages" id="messages" aria-live="polite" aria-label="Chat messages">
          <div class="empty-state" id="emptyState">
            <div class="empty-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 3l1.5 3.85L17.5 7l-3.12 2.62.98 3.88L12 11.36 8.64 13.5l.98-3.88L6.5 7l4-.15L12 3z" /><path d="M6 15.5h12M8.5 19h7" /></svg>
            </div>
            <h3>Ask LalaCore anything</h3>
            <p>JEE math, explanations, image questions, PDF context, or a clean study answer.</p>
            <div class="prompt-row" id="promptChips"></div>
          </div>
        </section>

        <footer class="composer-wrap">
          <div class="attachment-tray" id="attachmentTray" hidden></div>
          <form class="composer" id="composer">
            <input id="fileInput" type="file" accept="image/*,application/pdf" hidden />
            <button class="icon-button attach-button" id="attachButton" type="button" aria-label="Attach image or PDF">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M21.4 11.1 12 20.5a6 6 0 0 1-8.5-8.5l9.7-9.7a4.2 4.2 0 0 1 5.9 5.9L9.5 17.8a2.4 2.4 0 1 1-3.4-3.4l8.8-8.8" /></svg>
            </button>
            <textarea id="promptInput" rows="1" placeholder="Ask LalaCore..."></textarea>
            <button class="send-button" id="sendButton" type="submit" aria-label="Send message">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
            </button>
          </form>
        </footer>
      </main>
    </div>

    <template id="messageTemplate">
      <article class="message">
        <div class="bubble">
          <div class="message-meta"></div>
          <div class="message-content"></div>
          <div class="message-extras"></div>
        </div>
      </article>
    </template>

    <script src="./static/app.js" type="module"></script>
  </body>
</html>
